<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Yönetim paneli — Emre Şavklı</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;font-stretch:75% 100%;src:url(fonts/bricolage-grotesque-latin-ext-standard-normal.woff2) format("woff2-variations");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;font-stretch:75% 100%;src:url(fonts/bricolage-grotesque-latin-standard-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Geist";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/Geist-Variable.woff2) format("woff2-variations")}
:root{
  --bg:#08090D;--panel:#0F1118;--panel-2:#141722;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
  --text:#F1EFEA;--muted:#8C92A1;--dim:#5D6372;--ink:#0C0E13;
  --peri:#8B9BFF;--lilac:#C7A4FF;--amber:#FFC07A;--mint:#4ADE9B;--rose:#FF7A8C;
  --grad:linear-gradient(100deg,#8B9BFF 0%,#C7A4FF 45%,#FFC07A 100%);
  --display:"Bricolage Grotesque","Geist",system-ui,sans-serif;--sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
.glow{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.glow i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.22}
.glow i:nth-child(1){width:46vw;height:46vw;background:#3A47D9;right:-12vw;top:-20vw}
.glow i:nth-child(2){width:30vw;height:30vw;background:#8E5BEA;left:-10vw;bottom:-12vw;opacity:.16}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(420px,100%);background:rgba(15,17,24,.82);border:1px solid var(--line);border-radius:28px;padding:36px 32px;backdrop-filter:blur(20px)}
.mark{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);font-weight:700;font-size:13px}
.login h1{font-family:var(--display);font-weight:700;font-stretch:92%;font-size:40px;line-height:1;letter-spacing:-.03em;margin:22px 0 8px}
.login p{color:var(--muted)}
.login form{display:flex;flex-direction:column;gap:16px;margin-top:26px}
.field{display:flex;flex-direction:column;gap:7px}
.field > span{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .3s,background .3s}
.field textarea{resize:vertical;min-height:96px;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--lilac);background:rgba(255,255,255,.05)}
.field small{color:var(--dim);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14.5px;transition:transform .4s var(--ease),background .3s,color .3s,opacity .3s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.5;transform:none;cursor:default}
.btn-primary{background:var(--grad);color:var(--ink)}
.btn-light{background:var(--text);color:var(--ink)}
.btn-ghost{border:1px solid var(--line-2)}
.btn-ghost:hover{background:rgba(255,255,255,.06)}
.btn-danger{border:1px solid rgba(255,122,140,.4);color:#FFB3BE}
.btn-danger:hover{background:rgba(255,122,140,.12)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.back svg{width:18px;height:18px}
.err{color:#FF9AA8;font-size:14px}
.err:empty{display:none}
.demo-note{margin-top:20px;padding:14px 16px;border-radius:14px;background:rgba(255,192,122,.08);border:1px solid rgba(255,192,122,.25);color:#FFD9AE;font-size:13.5px;line-height:1.5}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:rgba(10,11,16,.6);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.brand b{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.tab{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#B9BECA;font-weight:500;text-align:left;transition:background .3s,color .3s}
.tab svg{width:18px;height:18px;flex:none;opacity:.8}
.tab:hover{background:rgba(255,255,255,.04);color:#fff}
.tab[aria-selected="true"]{background:rgba(255,255,255,.08);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .who{font-size:12.5px;color:var(--muted);padding:0 8px 6px;word-break:break-all}
.main{padding:34px clamp(20px,4vw,56px) 140px;max-width:1180px;width:100%}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.page-h h2{font-family:var(--display);font-weight:700;font-stretch:92%;font-size:clamp(34px,4vw,52px);line-height:1;letter-spacing:-.03em}
.page-h p{color:var(--muted);max-width:38em;margin-top:10px}
.card{background:rgba(15,17,24,.7);border:1px solid var(--line);border-radius:22px;padding:24px}
.card + .card{margin-top:16px}
.card h3{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;margin-bottom:4px}
.card > p.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lang-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);color:#C9CDD6;margin-left:6px;vertical-align:1px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:rgba(255,192,122,.08);border:1px solid rgba(255,192,122,.25);color:#FFD9AE;font-size:13.5px;margin-bottom:22px}

/* status */
.status-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sopt{position:relative;text-align:left;padding:20px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.02);transition:border-color .3s,background .3s,transform .4s var(--ease)}
.sopt:hover{transform:translateY(-2px);border-color:var(--line-2)}
.sopt[aria-checked="true"]{border-color:rgb(var(--c));background:rgba(var(--c),.08)}
.sopt .o{display:block;width:12px;height:12px;border-radius:50%;background:rgb(var(--c));box-shadow:0 0 14px rgba(var(--c),.9);margin-bottom:16px}
.sopt b{font-family:var(--display);font-weight:600;font-size:19px;display:block}
.sopt small{color:var(--muted);font-size:13px;display:block;margin-top:4px}
.preview-cap{display:inline-flex;align-items:center;gap:12px;padding:9px 18px 9px 12px;border-radius:999px;border:1px solid rgba(var(--c),.5);background:rgba(255,255,255,.04);font-size:14px;font-weight:500;margin-top:20px}
.preview-cap i{width:10px;height:10px;border-radius:50%;background:rgb(var(--c));box-shadow:0 0 12px rgba(var(--c),.9)}
.preview-cap span:last-child{color:var(--muted);padding-left:12px;border-left:1px solid rgba(255,255,255,.18)}

/* projects list */
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:auto 44px 1fr auto;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:rgba(15,17,24,.7);transition:border-color .3s,background .3s}
.prow:hover{border-color:var(--line-2)}
.prow.hidden-p{opacity:.55}
.order{display:flex;flex-direction:column;gap:2px}
.order button{width:26px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.order button:hover{background:rgba(255,255,255,.07);color:#fff}
.order button[disabled]{opacity:.25;cursor:default;background:none}
.sw{width:44px;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;overflow:hidden}
.sw img{width:100%;height:100%;object-fit:cover}
.prow b{font-family:var(--display);font-weight:600;font-size:17px;display:block}
.prow small{color:var(--muted);font-size:13px}
.prow .acts{display:flex;gap:8px;align-items:center}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:#C9CDD6}
.pill.off{background:rgba(255,122,140,.12);color:#FFB3BE}

/* editor */
.editor-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.back:hover{color:#fff}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;transition:background .3s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .4s var(--ease)}
.switch input:checked + i{background:var(--mint)}
.switch input:checked + i::after{transform:translateX(18px)}
.switch input:focus-visible + i{outline:2px solid var(--amber);outline-offset:3px}
.facts-rows{display:flex;flex-direction:column;gap:12px}
.fact{display:grid;grid-template-columns:1fr 1fr 1.4fr 1.4fr;gap:10px}
.fact input{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .3s}
.fact input:focus{border-color:var(--lilac)}
.fact input::placeholder,.field input::placeholder{color:var(--dim)}
.techs{display:flex;flex-direction:column;gap:14px}
.tl b{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:8px}
.tl div{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 13px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;font-weight:500;color:#C9CDD6;display:inline-flex;align-items:center;gap:7px;transition:background .3s,border-color .3s,color .3s}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--lc)}
.chip:hover{border-color:var(--line-2);color:#fff}
.chip[aria-pressed="true"]{background:var(--lc);border-color:var(--lc);color:var(--ink)}
.chip[aria-pressed="true"] i{background:var(--ink)}
.themes{display:flex;gap:12px;flex-wrap:wrap}
.theme{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.theme span{width:54px;height:54px;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .4s var(--ease),box-shadow .3s}
.theme[aria-checked="true"] span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff;transform:translateY(-2px)}
.theme[aria-checked="true"]{color:#fff}
.mocks{display:flex;gap:8px;flex-wrap:wrap}
.media-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.media-item{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.02)}
.media-item .thumb{aspect-ratio:4/3;background:#000;display:grid;place-items:center;overflow:hidden}
.media-item img{width:100%;height:100%;object-fit:cover;object-position:top}
.media-item .mi-bar{display:flex;gap:6px;padding:8px;align-items:center}
.media-item select{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.icon-btn.danger:hover{background:rgba(255,122,140,.15);color:#FFB3BE}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line-2);border-radius:16px;padding:26px;text-align:center;color:var(--muted);transition:border-color .3s,background .3s;cursor:pointer}
.upload:hover,.upload.drag{border-color:var(--lilac);background:rgba(199,164,255,.06);color:#fff}
.upload b{color:#fff;font-weight:600}
.upload input{display:none}
.hint{color:var(--dim);font-size:12.5px;margin-top:8px}

/* save bar + toast */
.savebar{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);display:flex;align-items:center;gap:16px;padding:10px 10px 10px 20px;border-radius:999px;background:rgba(20,22,30,.92);border:1px solid var(--line-2);backdrop-filter:blur(18px);box-shadow:0 24px 50px -20px rgba(0,0,0,.7);transition:transform .6s var(--ease);z-index:20;margin-left:120px}
.savebar.show{transform:translate(-50%,0)}
.savebar span{font-size:14px;color:#C9CDD6;white-space:nowrap}
.savebar span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:10px;vertical-align:1px;box-shadow:0 0 10px var(--amber)}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-160%);padding:12px 18px;border-radius:999px;background:var(--text);color:var(--ink);font-weight:700;font-size:14px;z-index:30;transition:transform .55s var(--ease);box-shadow:0 20px 40px -16px rgba(0,0,0,.6)}
.toast.show{transform:translate(-50%,0)}
.toast.bad{background:#FF9AA8}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;z-index:10;gap:4px}
  .brand{padding:0 8px 0 0}
  .brand div{display:none}
  .side-foot{margin:0 0 0 auto;flex-direction:row}
  .side-foot .who{display:none}
  .tab{padding:9px 11px;white-space:nowrap}
  .tab svg{display:none}
  .savebar{margin-left:0}
  .status-opts{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .fact{grid-template-columns:1fr 1fr}
  .prow{grid-template-columns:auto 40px 1fr;row-gap:12px}
  .prow .acts{grid-column:1/-1;justify-content:flex-end}
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i></div>
<div id="root"><div class="loading">Yükleniyor…</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="content.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(function(){
  'use strict';
  var CFG=window.SITE_CONFIG||{}, DEF=window.DEFAULT_CONTENT, CAT=window.TECH_CATALOG;
  var DEMO=!(CFG.supabaseUrl && CFG.supabaseAnonKey);
  var sb=null;
  if(!DEMO && window.supabase){ sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey); }
  var root=document.getElementById('root');
  var data=null, saved='', view={tab:'status',editing:null}, user=null;

  /* ---------- helpers ---------- */
  function h(tag,attrs){
    var el=document.createElement(tag), kids=[].slice.call(arguments,2);
    if(attrs) Object.keys(attrs).forEach(function(k){
      var v=attrs[k]; if(v==null||v===false) return;
      if(k==='class') el.className=v;
      else if(k==='text') el.textContent=v;
      else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v);
      else if(k==='style' && typeof v==='object') Object.keys(v).forEach(function(p){ el.style.setProperty(p,v[p]); });
      else if(k==='value') el.value=v;
      else el.setAttribute(k,v===true?'':v);
    });
    kids.flat(Infinity).forEach(function(c){ if(c==null||c===false) return; el.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return el;
  }
  function svg(path){ var s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','1.8'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round'); s.innerHTML=path; return s; }
  var ICON={
    status:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
    projects:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v10"/>',
    texts:'<path d="M5 6h14M5 12h14M5 18h9"/>',
    quotes:'<path d="M7 7h4v4c0 3-2 5-4 6M15 7h4v4c0 3-2 5-4 6"/>',
    settings:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
    up:'<path d="M6 15l6-6 6 6"/>', down:'<path d="M6 9l6 6 6-6"/>', trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    left:'<path d="M15 6l-6 6 6 6"/>', ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
    plus:'<path d="M12 5v14M5 12h14"/>', image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>'
  };
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function merge(d){
    d=d||{};
    return { settings:Object.assign({},clone(DEF.settings),d.settings||{}), texts:Object.assign({},clone(DEF.texts),d.texts||{}), projects:Array.isArray(d.projects)?d.projects:clone(DEF.projects), testimonials:Array.isArray(d.testimonials)?d.testimonials:clone(DEF.testimonials||[]) };
  }
  function dirty(){ return JSON.stringify(data)!==saved; }
  function markDirty(){ var bar=document.querySelector('.savebar'); if(bar) bar.classList.toggle('show',dirty()); }
  var toastT=null;
  function toast(msg,bad){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.toggle('bad',!!bad); t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },2600); }
  function techName(t){ return typeof t.name==='string'?t.name:t.name.tr; }
  function slug(){ return 'p-'+Date.now().toString(36); }
  addEventListener('beforeunload',function(e){ if(data && dirty()){ e.preventDefault(); e.returnValue=''; } });

  /* ---------- data ---------- */
  function load(){
    if(DEMO){
      var d=null; try{ d=JSON.parse(localStorage.getItem('demo_content')||'null'); }catch(e){}
      return Promise.resolve(merge(d));
    }
    return sb.from('site_content').select('data').eq('id',1).maybeSingle().then(function(r){
      if(r.error) throw r.error;
      return merge(r.data&&r.data.data);
    });
  }
  function save(){
    var btn=document.querySelector('.savebar .btn'); if(btn){ btn.disabled=true; btn.textContent='Kaydediliyor…'; }
    var done=function(){ saved=JSON.stringify(data); markDirty(); if(btn){ btn.disabled=false; btn.textContent='Kaydet'; } toast(DEMO?'Kaydedildi (bu tarayıcıda)':'Kaydedildi. Sitede yayında.'); };
    var fail=function(err){ if(btn){ btn.disabled=false; btn.textContent='Kaydet'; } toast('Kaydedilemedi: '+(err&&err.message||'bağlantı hatası'),true); };
    if(DEMO){ try{ localStorage.setItem('demo_content',JSON.stringify(data)); done(); }catch(e){ fail({message:'tarayıcı depolama alanı doldu; görselleri küçültün'}); } return; }
